<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="slider">
        <div class="wrapper">
                <input type="radio" name="r" class="slider-slide" id="one" checked>
                <input type="radio" name="r" class="slider-slide" id="two">
                <input type="radio" name="r" class="slider-slide" id="three">
                <input type="radio" name="r" class="slider-slide" id="four">
                <input type="radio" name="r" class="slider-slide" id="five">
                <input type="radio" name="r" class="slider-slide" id="six">
                <input type="radio" name="r" class="slider-slide" id="seven">
                <input type="radio" name="r" class="slider-slide" id="eight">
                <input type="radio" name="r" class="slider-slide" id="nine">

            <div class="slide s1"><img src="./img/1.png" alt="one"><span>one</span> </div>
            <div class="slide"><img src="./img/2.png" alt="two"><span>two</span></div>
            <div class="slide"><img src="./img/3.png" alt="three"><span>three</span></div>
            <div class="slide"><img src="./img/4.png" alt="four"><span>four</span></div>
            <div class="slide"><img src="./img/5.png" alt="five"><span>five</span></div>
            <div class="slide"><img src="./img/6.png" alt="six"><span>six</span></div>
            <div class="slide"><img src="./img/7.png" alt="seven"><span>seven</span></div>
            <div class="slide"><img src="./img/8.png" alt="eight"><span>eight</span></div>
            <div class="slide"><img src="./img/9.png" alt="nine"><span>nine</span></div>
        
            <div class="slider__pagination">
                <label for="one" class="bar"></label>
                <label for="two" class="bar"></label>
                <label for="three" class="bar"></label>
                <label for="four" class="bar"></label>
                <label for="five" class="bar"></label>
                <label for="six" class="bar"></label>
                <label for="seven" class="bar"></label>
                <label for="eight" class="bar"></label>
                <label for="nine" class="bar"></label>
        </div>
        </div>
    </div>
</body>
</html>
